<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Partner Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Shopping Partner</h1>

    <h3>Upload Grocery List</h3>

    <textarea
        rows="8"
        cols="40"
        placeholder="Enter one grocery item per line"></textarea>

    <br><br>

    <button>Upload List</button>

    <br><br>

    <input
        type="text"
        placeholder="Search Product">

    <button>Search</button>

    <h3>AI Suggestions</h3>

    <div id="output">
        AI suggestions will appear here...
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
